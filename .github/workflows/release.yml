name: Release

# Gatilho: apenas quando uma tag seguindo o padrão v* é criada (v1.0.0, v2.3.1, etc.).
# Tags são a convenção universal para marcar versões de software.
# O workflow NÃO roda em branches — só em tags.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: CI ────────────────────────────────────────────────────────────────
  # Antes de publicar qualquer release, repetimos as verificações de qualidade.
  # Isso é uma garantia extra: se alguém criar uma tag sem o CI ter passado antes,
  # esse job impede que um binário quebrado seja publicado.
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgtk-3-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  # ── Job 2: Build ─────────────────────────────────────────────────────────────
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    # Este job só inicia se o job "ci" terminar com sucesso.
    # "needs" cria uma dependência explícita entre jobs. Sem isso, os dois
    # rodariam em paralelo e o release poderia ser publicado mesmo com CI falhando.
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgtk-3-dev \
            pkg-config

      # Compila em modo --release: otimizações completas, binário menor e mais rápido.
      # A diferença para --debug é significativa: código ~10x mais rápido, binário menor.
      - name: Build release binaries
        run: cargo build --release --workspace

      # Empacota os binários compilados em um .tar.gz com o nome da tag no nome do arquivo.
      # github.ref_name é uma variável de contexto que contém o nome da tag (ex: "v1.0.0").
      # Isso permite que o usuário identifique exatamente qual versão está baixando.
      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/rust-recovery-ui dist/
          cp target/release/cli dist/rust-recovery-cli
          tar -czf rust-recovery-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      # Faz upload do arquivo compactado como artefato temporário do workflow.
      # Artefatos ficam disponíveis entre jobs do mesmo workflow por até 90 dias.
      # O job de release (abaixo) usará esse artefato para criar o GitHub Release.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: rust-recovery-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ── Job 3: Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    # Permissão explícita para criar releases no repositório.
    # Por padrão o GITHUB_TOKEN tem permissões mínimas (read-only em muitas ações).
    # Declarar permissões é uma boa prática de segurança: princípio do menor privilégio.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Baixa o artefato produzido pelo job "build" para o runner atual.
      # Jobs são máquinas independentes — sem isso o arquivo .tar.gz não estaria disponível aqui.
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-binaries

      # Cria o GitHub Release com o binário como asset.
      # - tag_name e name usam github.ref_name (o nome da tag, ex: "v1.0.0")
      # - generate_release_notes: true cria automaticamente um changelog baseado nos
      #   commits desde a tag anterior, listando PRs mergeados e seus autores.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: rust-recovery-${{ github.ref_name }}-linux-x86_64.tar.gz
