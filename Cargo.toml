[workspace]
members = [
  "apps/cli",
  "apps/ui",
  "crates/device_detector",
  "crates/file_carver",
  "crates/recovery_engine",
]
resolver = "2"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
byteorder = "1"
iced = { version = "0.14", features = ["tokio", "image"] }
tokio = { version = "1", features = ["full"] }
